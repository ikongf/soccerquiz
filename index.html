<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indoor Tactics Quiz – Defend &amp; Attack</title>
<style>
  :root{--bg:#0f1a14;--panel:#16251c;--line:#2c4434;--txt:#e8f0e9;--mut:#93a89a;--acc:#f2c14e;--def:#3d8bfd;--att:#e5484d;--ok:#3ecf8e;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--acc)}
  .score{color:var(--mut);font-variant-numeric:tabular-nums}
  .bar{height:4px;background:var(--line)}.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
  main{display:grid;grid-template-columns:minmax(300px,560px) 1fr;gap:20px;padding:20px;max-width:1200px;margin:auto}
  @media(max-width:860px){main{grid-template-columns:1fr}}
  canvas#field{width:100%;height:auto;background:var(--panel);border-radius:14px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .panel{background:var(--panel);border-radius:14px;padding:18px}
  .tag{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--acc)}
  h2{margin:4px 0 6px;font-size:20px}
  .q{color:var(--mut);margin:0 0 14px}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .opt{background:#0f1a14;border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;color:var(--txt);text-align:left;font:inherit}
  .opt:hover:not(:disabled){border-color:var(--acc)}
  .opt canvas{width:100%;display:block;border-radius:6px}
  .opt b{display:block;padding:4px 2px 0}
  .opt.right{border-color:var(--ok)}.opt.watching{outline:2px dashed var(--acc);outline-offset:2px}
.opt.alt{border-color:var(--acc)}.opt.wrong{border-color:var(--bad)}
  .opt:disabled{cursor:default}
  .msg{margin-top:14px;padding:12px;border-radius:10px;background:#0f1a14;border-left:4px solid var(--acc);display:none}
  .msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button.b{background:var(--acc);color:#1b1b1b;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
  button.b.s{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .roles{font-size:13px;color:var(--mut);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .roles b{color:var(--txt)}
  .mode{display:flex;gap:6px}.mode button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
  .mode button.on{background:var(--acc);color:#1b1b1b;border-color:var(--acc);font-weight:600}
  .cons{display:block;font-size:12px;color:var(--mut);padding:2px}
  .opt.selected{border-color:var(--acc)}
  .opt .watch{display:block;font-size:12px;color:var(--acc);padding:2px;font-weight:600}
  .opt:hover .watch{text-decoration:underline}
  .hint{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:13px;color:var(--acc);background:rgba(242,193,78,.09);border:1px dashed var(--acc);border-radius:8px;padding:8px 10px}
  .mode button:focus-visible,.opt:focus-visible,button.b:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
  [hidden]{display:none!important}
  @media(max-width:400px){main{padding:10px;gap:12px;grid-template-columns:minmax(0,1fr)}.panel{padding:12px}.opt b{font-size:13px}}
  @media(prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<header>
  <h1>INDOOR TACTICS <span>QUIZ</span> · Pressure · Cover · Balance</h1>
  <div class="mode side"><button data-side="defend">Defend</button><button data-side="attack">Attack</button></div>
  <div class="mode set"><button data-s="cur">Curated</button><button data-s="gen">Endless</button></div>
  <div class="mode"><button data-m="3">3v3 Fundamentals</button><button data-m="4">4v4 Advanced</button></div>
  <div class="score" id="score"></div>
</header>
<div class="bar"><i id="prog"></i></div>
<main>
  <div>
    <canvas id="field" width="880" height="840"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:var(--def)"></i>Defenders (P pressure · C cover · B balance · M man-marking)</span>
      <span><i class="dot" style="background:var(--att)"></i>Attackers</span>
      <span><i class="dot" style="background:#fff"></i>Ball</span>
      <span><i class="dot" style="background:#f2c14e"></i>Blue keeper (auto)</span>
    </div>
  </div>
  <div class="panel" id="panel"></div>
</main>
<script>
/* Field: our defensive half of an oval indoor rink. Units = meters.
   x: 0 = our goal line/end wall, 20 = halfway line. y: 0..20 across. Attack goes toward x=0. */
const W=20,H=20,R=6,GOAL=[8.5,11.5];

const S=[
{title:"Central ball, triangle shape",q:"Attacker 1 has the ball centrally. Attackers 2 and 3 offer width. Pick the best defending shape.",
 att:{A1:[14,10],A2:[12,4],A3:[11,16]},
 opts:[
  {d:[[12.6,10],[10.5,7.3],[8,12.6]],ok:1,tag:"all",why:"D1 closes the ball down, D2 sits goal-side between the ball and A2 (backs up D1 and can step to A2), D3 is deepest on the far side: cover of the cover while watching A3.",
   anim:[{t:600,D1:[13.3,10],msg:"D1 presses"},{t:500,A1:[14.6,10.4]},{t:700,ball:[16.5,7.5],A2:[16.5,7.5],own:"A2",msg:"No forward option – attack goes backwards ✔"}]},
  {d:[[12.8,10],[13,8.4],[13,11.6]],ok:0,tag:"cover",why:"Everyone ran to the ball. No cover, no balance – one simple pass to A2 breaks all three defenders.",
   anim:[{t:700,ball:[12,4],own:"A2"},{t:1100,A2:[5,7],D2:[9,6],D1:[10,8],D3:[10,10]},{t:500,ball:[0,9.4],msg:"Potential GOAL – no cover"}]},
  {d:[[10,10],[10,5],[10,15]],ok:0,tag:"pressure",why:"A flat line with nobody pressing. A1 has all the time in the world to step in and shoot.",
   anim:[{t:900,A1:[10.8,10],msg:"No pressure..."},{t:500,ball:[0,10.9],msg:"Potential GOAL – no pressure"}]},
  {d:[[12.6,10],[12,5],[11,15.2]],ok:0,tag:"balance",why:"D2 and D3 man-mark tight and square. When A1 beats D1 there is nobody behind – no cover, no balance.",
   anim:[{t:900,A1:[8,9],D1:[10,9.6],msg:"A1 beats D1 – nobody behind"},{t:500,ball:[0,9.2],msg:"Potential GOAL"}]}
 ]},
{title:"Ball near the wall",q:"A1 has the ball near the left wall. How should D1 press and how should the others support?",
 att:{A1:[13,3],A2:[12,10],A3:[9,16]},
 opts:[
  {d:[[11.4,4.1],[9.6,7],[6.5,11]],ok:1,tag:"all",why:"D1 presses on the inside shoulder, showing A1 down the wall (away from goal). D2 covers on the inside diagonal, D3 balances centrally and still sees A3.",
   anim:[{t:700,A1:[11.4,2.3],D1:[10.8,3]},{t:500,ball:[10.8,2.8],own:"D1",msg:"Forced into the wall – ball won ✔"}]},
  {d:[[11.8,2.3],[9,10],[6,14]],ok:0,tag:"pressure",why:"D1 pressed from the wall side and showed A1 inside, straight toward goal.",
   anim:[{t:900,A1:[9.5,6.5],D1:[10.5,4]},{t:500,ball:[0,9.1],msg:"Potential GOAL – shown inside"}]},
  {d:[[11.4,4.1],[11.4,9],[8,15]],ok:1,tag:"cover",consequence:"tradeoff",why:"D2 prioritizes the pass to human attacker A2, and D3 stays goal-side of A3. This is defensible, but D2 is level with P and D3 is wide, so backup against an inside dribble or precise wall rebound is weaker. The deeper inside diagonal offers more connected cover; the wall attempt is a contested possibility, not an automatic failure.",
   anim:[{t:400,ball:[11,0.2],msg:"If the wall pass is precise…"},{t:400,ball:[8,2.6],A1:[9.5,2.6],D1:[9.8,3.3]},{t:500,A1:[8,2.6],own:"A1",D1:[8.8,3.4],D2:[9,7],D3:[6.5,12]},{t:500,msg:"Contested rebound – cover recovering"}]},
  {d:[[11.4,4.1],[9.6,7],[9,15.3]],ok:0,tag:"balance",why:"D3 is tight on A3 far away. That leaves a huge central gap behind D2 – the space balance should protect.",
   anim:[{t:700,A2:[6,10]},{t:500,ball:[5.5,10],own:"A2",msg:"Run in behind – no balance"},{t:500,ball:[0,10.5],msg:"Potential GOAL"}]}
 ]},
{title:"Wall-pass threat",q:"D1 presses from the inside shoulder, limiting the direct route inside but leaving the wall available. A2 can receive, shoot, combine off the wall or improvise. Which shape prioritizes A2 while keeping cover behind D1?",
 att:{A1:[10,3],A2:[13,9],A3:[10,15]},
 opts:[
  {d:[[8.8,3.7],[6.6,5.6],[5.5,10.5]],ok:0,tag:"cover",consequence:"tradeoff",why:"This protects the self-wall rebound, but D2 has moved too far from A2. The wall returns one predictable ball only if angle and weight are right; A2 can shoot, pass, combine off the wall or change direction. Prioritize the player, while still watching the rebound. A wall specialist could justify shading farther toward the boards.",
   anim:[{t:600,ball:[13,9],own:"A2",msg:"A2 receives with space"},{t:700,A2:[11,9.5],D2:[8.5,7],D3:[6,10.5]},{t:500,msg:"A2 has options – defenders recovering"}]},
  {d:[[8.8,3.7],[9,8],[6,12]],ok:1,preferred:1,tag:"all",consequence:"tradeoff",why:"D2 stays goal-side of A2 and can close the receiver, while retaining depth behind D1. D3 balances inside and watches A3. The human attacker is the main threat. The wall is still available, so D2 must scan and recover if a precisely weighted rebound beats D1; this shape reduces risk, not guarantees a stop.",
   anim:[{t:600,ball:[13,9],own:"A2",D2:[11.5,8.8],D3:[6.5,11.5],msg:"D2 closes the receiver"},{t:600,A2:[13.7,10],D2:[12.2,9.4],D1:[9,5]},{t:500,msg:"A2 under pressure – wall still available"}]},
  {d:[[8.8,3.7],[12.3,8.6],[9.5,14.3]],ok:1,tag:"cover",consequence:"tradeoff",why:"Tight marking limits the easiest pass to A2 and keeps A3 occupied. But D2 is farther from D1, and D3 has less depth for balance. If A1 executes the self-wall pass precisely, D1 must recover and the others drop quickly. Against ordinary rec players, prioritizing A2 can make sense; the more balanced shape retains better backup.",
   anim:[{t:400,ball:[8.5,0.2],msg:"If the wall pass is precise…"},{t:400,ball:[6.6,2.6],A1:[7.4,2.6],D1:[7.8,3.5]},{t:500,A1:[6.6,2.6],own:"A1",D1:[7,3.5],D2:[10,7],D3:[7.5,12]},{t:500,msg:"Contested rebound – cover recovering"}]},
  {d:[[8.8,3.7],[2.5,8],[2.5,12]],ok:0,tag:"balance",why:"Too deep. Cover must be close enough to help. A2 is totally free to receive and shoot.",
   anim:[{t:600,ball:[13,9],own:"A2"},{t:700,A2:[9,9.5]},{t:500,ball:[0,10.8],msg:"Potential GOAL – free shot from range"}]}
 ]},
{title:"Overlapping run",q:"A1 has the ball; A2 starts an overlapping run outside A1 toward the corner. Best shape?",
 att:{A1:[13,8],A2:[15,5],A3:[10,15]},runs:[[[15,5],[9,3]]],
 opts:[
  {d:[[11.8,8.6],[11,5.6],[7.5,11]],ok:1,tag:"all",why:"D1 keeps pressure. D2 tracks the runner goal-side, D3 slides across to cover the middle while staying aware of A3.",
   anim:[{t:900,A2:[9,3],D2:[8.6,3.9],D3:[7,9.5]},{t:500,ball:[8.7,3.5],own:"D2",msg:"Runner tracked – interception ✔"}]},
  {d:[[11.8,8.6],[11,10],[7.5,12]],ok:0,tag:"cover",why:"D2 watched the ball and let the overlap go. A2 is free in the corner.",
   anim:[{t:900,A2:[9,3]},{t:500,ball:[9,3],own:"A2"},{t:800,A2:[4,6]},{t:500,ball:[0,9.4],msg:"Potential GOAL – runner lost"}]},
  {d:[[8.5,8.5],[11,5.6],[7.5,11]],ok:0,tag:"pressure",why:"D1 dropped off. Without pressure, A1 doesn't even need the overlap – just shoots.",
   anim:[{t:600,A1:[11.5,8.5]},{t:500,ball:[0,10.3],msg:"Potential GOAL – no pressure"}]},
  {d:[[11.8,8.6],[11,5.6],[10.5,6.5]],ok:0,tag:"balance",why:"D3 also chased the runner. Two defenders on one attacker leaves A3 and the far side empty.",
   anim:[{t:600,ball:[10,15],own:"A3",A2:[10,3]},{t:800,A3:[5,12]},{t:500,ball:[0,11],msg:"Potential GOAL – no balance"}]}
 ]},
{title:"After a switch of play",q:"The ball was just switched to A3 on the right. How should the defenders re-shape?",
 att:{A1:[14,4],A2:[13,10],A3:[12,16]},ballAt:"A3",
 opts:[
  {d:[[10.8,15.4],[9.6,12],[7,8.5]],ok:1,tag:"all",why:"Roles rotate: the nearest defender becomes D1 and presses, the next covers inside, and the old D1 becomes the deep balance on the far side.",
   anim:[{t:600,D1:[11.4,15.6]},{t:700,ball:[16,12],A2:[16,12],own:"A2",msg:"Forced backwards ✔"}]},
  {d:[[12,5],[10,8],[7,11]],ok:0,tag:"pressure",why:"Nobody shifted. A3 drives inside unopposed.",
   anim:[{t:900,A3:[6,14]},{t:500,ball:[0,11],msg:"Potential GOAL – nobody shifted"}]},
  {d:[[11,15.5],[10.5,14],[10,16.6]],ok:0,tag:"balance",why:"All three crowded the ball side. The middle opens for A2.",
   anim:[{t:500,ball:[13,10],own:"A2"},{t:800,A2:[6,10]},{t:500,ball:[0,9.8],msg:"Potential GOAL – no balance"}]},
  {d:[[10.8,15.4],[9,10],[9,6]],ok:0,tag:"cover",why:"D2 and D3 are flat. A2 runs between D1 and D2 into the gap.",
   anim:[{t:800,A2:[6,13]},{t:500,ball:[6,13],own:"A2",msg:"Through the gap"},{t:500,ball:[0,10.7],msg:"Potential GOAL – no cover"}]}
 ]},
{title:"Run in behind",q:"A3 is about to make a run in behind the defense. Where should D3 be?",
 att:{A1:[13,6],A2:[14,13],A3:[11,10]},runs:[[[11,10],[4,11]]],
 opts:[
  {d:[[11.8,6.6],[10,9.2],[6.2,11.5]],ok:1,tag:"all",why:"D3 is the deepest defender – the cover of the cover – so the run in behind runs straight into them.",
   anim:[{t:900,A3:[5,11]},{t:500,ball:[5.8,11],D3:[5.8,11.2],own:"D3",msg:"Balance kills the run ✔"}]},
  {d:[[11.8,6.6],[10,9.2],[10,13]],ok:0,tag:"balance",why:"D3 is level with D2. Nobody protects the space behind.",
   anim:[{t:900,A3:[4,11]},{t:500,ball:[4,11],own:"A3"},{t:400,ball:[0,9.5],msg:"Potential GOAL – no balance"}]},
  {d:[[11.8,6.6],[10,9.2],[13,12.6]],ok:0,tag:"balance",why:"D3 is tight on A2, high up the pitch. Marking A2 matters less than the space behind.",
   anim:[{t:900,A3:[4,11]},{t:500,ball:[4,11],own:"A3"},{t:400,ball:[0,9.5],msg:"Potential GOAL"}]},
  {d:[[9,6],[10,9.2],[6.2,11.5]],ok:0,tag:"pressure",why:"D1 stands off. A1 shoots before the run even matters.",
   anim:[{t:500,A1:[12,6.5]},{t:500,ball:[0,8.9],msg:"Potential GOAL – no pressure"}]}
 ]},
{title:"Ball deep in the corner",q:"A1 dribbles deep in the corner near our goal. Best shape?",
 att:{A1:[3,2.5],A2:[8,6],A3:[9,14]},
 opts:[
  {d:[[3.4,4.2],[5,8.3],[6.5,11.5]],ok:1,tag:"all",why:"D1 is goal-side and blocks the route to goal. D2 guards the cut-back zone, D3 protects the far post and sees A3.",
   anim:[{t:500,A2:[6.5,8.5]},{t:500,ball:[5.4,8.3],own:"D2",msg:"Cut-back intercepted ✔"}]},
  {d:[[4.6,2],[5,8.3],[6.5,11.5]],ok:0,tag:"pressure",why:"D1 is on the wrong side (not goal-side). A1 cuts straight in to goal.",
   anim:[{t:800,A1:[2,7]},{t:400,ball:[0,9.4],msg:"Potential GOAL – not goal-side"}]},
  {d:[[3.4,4.2],[4.6,4.8],[5.3,5.6]],ok:0,tag:"cover",why:"D2 and D3 ball-watch next to D1. The cut-back to A2 is wide open.",
   anim:[{t:500,A2:[7,9]},{t:500,ball:[7,9],own:"A2"},{t:400,ball:[0,10.6],msg:"Potential GOAL – free cut-back"}]},
  {d:[[3.4,4.2],[5,5],[9,13.4]],ok:0,tag:"balance",why:"D3 man-marks A3 far away. The central space in front of goal is empty.",
   anim:[{t:500,A2:[7,9]},{t:500,ball:[7,9],own:"A2"},{t:400,ball:[0,10.2],msg:"Potential GOAL"}]}
 ]},
{mode:4,title:"4v4: Central overload",q:"A1 has the ball centrally, A2 and A3 offer angles, A4 waits far side. Pick the shape (P pressure · C cover · B balance).",
 att:{A1:[14,10],A2:[12,5],A3:[11,14],A4:[8,17.5]},
 opts:[
  {d:[[12.6,10],[10.6,7.5],[9.8,12.3],[6.5,13.5]],roles:["P","C","C","B"],ok:1,tag:"all",why:"One presses, two cover on both diagonals (each backs up the presser and is goal-side of their attacker), and the deepest defender balances the far side, watching A4 and the back post.",
   anim:[{t:600,D1:[13.3,10],msg:"Both passing lanes covered"},{t:700,ball:[17,8],A2:[17,8],own:"A2",msg:"Forced backwards ✔"}]},
  {d:[[12.6,10],[11,5.5],[11,10.5],[11,15]],roles:["P","C","C","C"],ok:0,tag:"balance",why:"A flat line of three behind the presser. Nobody is deep – one ball in behind and A3 is through.",
   anim:[{t:600,A3:[7,12]},{t:500,ball:[7,12],own:"A3",msg:"In behind the flat line"},{t:500,ball:[0,10.6],msg:"Potential GOAL – no balance"}]},
  {d:[[12.8,10],[13,8.4],[13,11.6],[11.6,10]],roles:["P","P","P","C"],ok:0,tag:"cover",why:"Four on the ball. A simple pass to A2 and the whole team is bypassed.",
   anim:[{t:600,ball:[12,5],own:"A2"},{t:900,A2:[5,7.5]},{t:500,ball:[0,9.4],msg:"Potential GOAL – no cover"}]},
  {d:[[9,10],[9,6],[9,13],[6,15]],roles:["C","C","C","B"],ok:0,tag:"pressure",why:"Good depth, but nobody presses the ball. A1 steps in and shoots.",
   anim:[{t:800,A1:[11,10],msg:"No pressure..."},{t:500,ball:[0,10.9],msg:"Potential GOAL – no pressure"}]}
 ]},
{mode:4,title:"4v4: Wall give-and-go + trailing runner",q:"A1 has the wall available, but A2 can receive, shoot or combine. A3 makes a trailing run inside. Which shape prioritizes the human receivers while backing up pressure?",
 att:{A1:[10,3],A2:[13,8],A3:[14,13],A4:[9,16.5]},runs:[[[14,13],[6.5,8]]],
 opts:[
  {d:[[8.8,3.7],[6.6,5.6],[9.6,9.5],[5.5,12]],roles:["P","C","C","B"],ok:0,tag:"cover",consequence:"tradeoff",why:"D2 camps near a predicted self-wall rebound, leaving A2 too much space. Tracking A3 and keeping balance helps, but does not replace cover of A2: a human can shoot, pass, combine off the wall or improvise. This shading might help against a proven wall specialist, but it is not the preferred default.",
   anim:[{t:600,ball:[13,8],own:"A2",msg:"A2 receives with space"},{t:700,A2:[11.5,8],D2:[8.5,7],A3:[8,9],D3:[7.6,8.6],D4:[5,12]},{t:500,msg:"A2 has options – cover recovering"}]},
  {d:[[8.8,3.7],[9.2,7.2],[8.5,10],[5.5,12]],roles:["P","C","C","B"],ok:1,preferred:1,tag:"all",consequence:"tradeoff",why:"D2 prioritizes human attacker A2, staying goal-side and ready to close the central pass while backing up P's inside shoulder. D3 tracks A3's trailing run and D4 balances deep while watching A4. The wall remains available, but needs precise angle and weight; scan and recover rather than abandon A2 to camp on a rebound. This shape reduces risk, not guarantees a stop.",
   anim:[{t:600,ball:[13,8],own:"A2",D2:[11.5,7.8],A3:[10,11],D3:[8,9.5],msg:"D2 closes human receiver"},{t:700,A3:[6.5,8],D3:[6.2,8.8],D1:[9,5],D4:[5,11.8],msg:"Trailing run tracked"},{t:600,ball:[15,6],A1:[15,6],own:"A1",msg:"Attack resets – wall still available"}]},
  {d:[[8.8,3.7],[6.6,5.6],[13,12],[9,15.6]],roles:["P","C","M","M"],ok:0,tag:"balance",why:"Two defenders man-mark high. The trailing runner arrives unmarked in the middle.",
   anim:[{t:900,A3:[6.5,8]},{t:500,ball:[6.5,8],own:"A3",msg:"Trailing runner free"},{t:400,ball:[0,9.8],msg:"Potential GOAL – no balance"}]},
  {d:[[8.8,3.7],[6.6,5.6],[7,8],[7.5,10]],roles:["P","C","C","C"],ok:0,tag:"balance",why:"D2 shades toward the rebound instead of A2, and everyone drifts ball side without deep weak-side balance. A2 can receive and find A4 arriving at the back post.",
   anim:[{t:500,ball:[13,8],own:"A2"},{t:700,A4:[4,14]},{t:500,ball:[4,14],own:"A4"},{t:400,ball:[0,11],msg:"Potential GOAL – back post open"}]}
 ]},
{mode:4,title:"4v4: Switch + back-door cut",q:"The ball was switched to A4 on the right while A3 cuts back-door toward the far post. How do the roles rotate?",
 att:{A1:[14,4],A2:[13,9],A3:[9,12],A4:[12,16.5]},ballAt:"A4",runs:[[[9,12],[3,13]]],

function validateScenario(sc){
  const pref=sc.opts.find(o=>o.preferred),A=Object.values(sc.att);
  if(sc.opts.filter(o=>o.ok).length!==1)return false;
  for(const p of A)if(!inRink(p))return false;
  for(const o of sc.opts){for(const p of o.d)if(!inRink(p))return false;
    for(const f of o.anim)for(const k in f)if(Array.isArray(f[k])&&!(k==="ball"&&f[k][0]===0)&&!inRink(f[k]))return false;}
  const all=[...A,...pref.d];for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)if(dst(all[i],all[j])<0.9)return false;
  for(const o of sc.opts)if(o!==pref&&Math.max(...o.d.map((p,i)=>dst(p,pref.d[i])))<2.5)return false;
  const r1=sc.att[sc.meta.r1k],C=pref.d[1];
  if(!(C[0]<r1[0])||!(C[0]<=pref.d[0][0]-0.8)||dst(C,pref.d[0])>3.5||(r1[0]<=pref.d[0][0]-1.5&&dst(C,r1)>3))return false;
  if(pref.anim.some(f=>f.ball&&f.ball[0]===0))return false;
  return true;
}
function buildBatch(mode,seed){
  const r=rng(seed),n=mode===3?8:6,pool=ARCH.filter(a=>mode===4||!a.only4),out=[];let last=null;
  while(out.length<n){let a;do a=pool[r()*pool.length|0];while(a===last&&pool.length>1);
    let sc=null;for(let t=0;t<60&&!sc;t++){const c=genScenario(mode,a,r);if(validateScenario(c))sc=c}
    if(!sc)continue;last=a;
    const o=sc.opts;for(let i=o.length-1;i>0;i--){const j=r()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}
    out.push(sc)}
  return out;
}

let FOLLOW=null,moveChance=false;
function showAttack(){
  const sc=FOLLOW||SS[idx];render(cv,initState(sc,{d:sc.d,roles:sc.roles}),sc);
  panel.innerHTML=`<div class="tag">Attack · Curated · ${MODE}v${MODE} · Scenario ${idx+1} of ${SS.length}${sc.step2?" · Step 2":""}</div><h2>${sc.title}</h2><p class="q">${sc.q}</p><div class="opts"></div><div class="msg" id="msg" aria-live="polite"></div><div class="btns" id="btns"></div>`;
  const box=panel.querySelector(".opts");
  sc.opts.forEach((o,i)=>{
    const b=document.createElement("button");b.className="opt";const c=document.createElement("canvas");c.width=264;c.height=252;b.appendChild(c);
    b.insertAdjacentHTML("beforeend",`<b>${o.name}</b>`);box.appendChild(b);const st=initState(sc,{d:sc.d,roles:sc.roles});st.plan=o.path;render(c,st,sc);
    b.onclick=()=>answerAttack(i,box);
  });
}
function answerAttack(i,box){
  const sc=FOLLOW||SS[idx],o=sc.opts[i],result=sampleAttack(sc,o);if(!sc.step2){attackPlays++;moveChance=false}
  if(result.outcome==="Chance created"&&!moveChance){attackChances++;moveChance=true}updHead();
  const next=!sc.step2&&!sc.shootNow&&result.best&&!o.reset?followUp(sc,o,result):null;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(i===j)b.classList.add("selected")});
  const m=document.getElementById("msg");m.style.display="block";m.innerHTML="<b>Play unfolding…</b>";
  const bt=document.getElementById("btns");
  bt.innerHTML=`<button class="b s" id="rp" disabled>↺ Replay</button><button class="b" id="nx">${next?"Next decision →":idx+1<SS.length?"Next scenario →":"See results"}</button>`;
  function finished(){m.innerHTML=`<b>${result.outcome} · ${o.read}</b><br>${o.why}<br><br>${result.note}${sc.step2?`<br><br><i>${sc.reveal}</i>`:next?"<br><br>Red still has the ball – keep the move going.":""}`;bt.querySelector("#rp").disabled=false;enableWatch()}
  play(sc,result,null,finished);
  bt.querySelector("#rp").onclick=()=>play(sc,result,null,finished);
  let hinted=false;
  function enableWatch(){
    [...box.children].forEach((b,j)=>{b.disabled=false;b.title="Watch this play";
      if(!b.querySelector(".watch"))b.insertAdjacentHTML("beforeend",'<small class="watch">▶ Watch this play</small>');
      b.onclick=()=>{const op=sc.opts[j],r=sampleAttack(sc,op);r.anim=r.anim;[...box.children].forEach(x=>x.classList.remove("watching"));b.classList.add("watching");
        m.innerHTML="<b>Play unfolding…</b>";play(sc,r,null,()=>{m.innerHTML=`<b>${j===i?"Your play":"Watching"}: ${op.name} – ${r.outcome} · ${op.read}</b><br>${op.why}<br><br>${r.note}<br><br><i>Watching doesn't change the next decision.</i>`})}});
    if(!hinted){hinted=true;const h=document.createElement("p");h.className="hint";h.textContent="▶ Click any play above to watch how it could turn out.";bt.after(h)}
  }
  bt.querySelector("#nx").onclick=()=>{if(next){FOLLOW=next}else{FOLLOW=null;idx++}show()};
}
function summary(){
  stopPlay();drawField(cv);
  if(SIDE==="attack"){
    panel.innerHTML=`<div class="tag">Attack · Finished</div><h2>${attackChances} chances from ${attackPlays} plays</h2><p class="q">Open angles, support triangles, and patient resets. Pick the best read to earn the follow-up decision; forced plays into a connected Blue shape get stopped.</p><div class="btns"><button class="b" id="again">Play again</button></div>`;
    document.getElementById("again").onclick=()=>start(MODE);return;
  }
  panel.innerHTML=`<div class="tag">Finished</div><h2>${SS.length} situations played</h2>
  <p class="q">Pressure the ball, cover the next human receiver goal-side, and keep a deep balance player. Play again for a fresh look.</p>
  <div class="btns"><button class="b" id="again">Play again</button></div>`;
  document.getElementById("again").onclick=()=>start(MODE);
}
function start(m){stopPlay();FOLLOW=null;MODE=m;idx=0;score=0;answered=0;attackPlays=0;attackChances=0;missed={pressure:0,cover:0,balance:0};
  SS=SIDE==="attack"?ATTACK.filter(x=>(x.mode||3)===m):SET==="gen"?buildBatch(m,(Date.now()^(Math.random()*1e9))|0):S.filter(x=>(x.mode||3)===m).map(x=>({...x,opts:shuffle([...x.opts])}));
  // make sure the correct slot varies: avoid same slot as previous scenario
  if(SIDE==="defend")for(let i=1;i<SS.length;i++){let t=0;while(SS[i].opts.findIndex(o=>o.ok)===SS[i-1].opts.findIndex(o=>o.ok)&&t++<20)shuffle(SS[i].opts)}
  document.querySelector("h1").innerHTML=SIDE==="attack"?(m===4?"ATTACKING <span>PLAYS</span> · 4v4 Box":"ATTACKING <span>PLAYS</span> · 3v3 Triangles"):"DEFENDING <span>QUIZ</span> · Pressure · Cover · Balance";
  document.querySelectorAll("[data-side]").forEach(b=>{b.classList.toggle("on",b.dataset.side===SIDE);b.setAttribute("aria-pressed",b.dataset.side===SIDE)});
  document.querySelector(".mode.set").hidden=SIDE==="attack";
  document.querySelectorAll(".mode button[data-m]").forEach(b=>b.classList.toggle("on",+b.dataset.m===m));document.querySelectorAll(".mode button[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===SET));show()}
document.querySelectorAll(".mode button[data-m]").forEach(b=>b.onclick=()=>start(+b.dataset.m));
document.querySelectorAll(".mode button[data-s]").forEach(b=>b.onclick=()=>{SET=b.dataset.s;start(MODE)});
document.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{SIDE=b.dataset.side;start(MODE)});
start(3);
</script>
</body>
</html>
